ane:2,t:"Kimi K2.5 frequently gets in a reiteration loop"},{n:15271,d:"2026-02-26",state:"closed",c:2,u:2,lane:2,t:"stuck in reasoning loop — 'changes' only in thinking"},{n:46030,d:"2026-08-28",state:"open",c:4,u:0,lane:2,t:"text loop without emitting tool calls (big-pickle)"},{n:46249,d:"2026-08-30",state:"closed",c:2,u:1,lane:2,t:"runaway self-referential loops in reasoning ('Let me run the grep…')"},{n:46492,d:"2026-08-31",state:"closed",c:2,u:0,lane:2,t:"intent-narration loop: announces a call, message ends, none sent"},{n:52763,d:"2026-10-02",state:"closed",c:2,u:0,lane:2,t:"output repetition loop across all providers"},{n:15533,d:"2026-03-01",state:"closed",c:27,u:12,lane:3,t:"auto-compaction infinite loop"},{n:27924,d:"2026-05-16",state:"closed",c:10,u:0,lane:3,t:"infinite compaction loop when compression fails"},{n:48827,d:"2026-09-13",state:"closed",c:2,u:0,lane:3,t:"auto-compaction loops forever (irreducible context)"},{n:52697,d:"2026-10-02",state:"closed",c:2,u:0,lane:3,t:"auto-compaction fixed point (never shrinks)"},{n:45989,d:"2026-08-28",state:"closed",c:12,u:1,lane:3,t:"infinite retry loop on rate limit"},{n:33006,d:"2026-06-19",state:"closed",c:4,u:0,lane:3,t:"OpenAI 500 server_error doom-loop"}],ja={en:{title:"opencode community: the loop problem in issues",sub:"A curated set of loop-related issues in anomalyco/opencode (Nov 2025 → Oct 2026; issue states verified 2026-10-22). The chart shows posting frequency by theme; the cards below carry the narrative and the reviewed issue list.",chartTitle:"Posts per month, stacked by theme",chartNote:"Posting accelerates sharply from Aug 2026 — the same period as the incident motivating this PR. Hover a segment for the issue numbers.",lanes:[{name:"A · detection gaps",story:"The community has pinpointed the current detector's blind spots, down to file and line: <b>cross-message repetitions never fire</b> (#51965, one day before the incident), <b>A,B,A,B rotations are invisible</b> (#47759, with a reproduction test attached), the threshold is hard-coded (#23531), and tweaking arguments bypasses matching (#32187). #25254 spelled out both bugs in May and was closed by the stale-bot, not by a fix. <b>Three of these match the incident's shape closely.</b> The freshest reports sharpen the current state: #56825 repeated one query dozens of times and was closed as a duplicate of #45442; #51965 was closed as v1-only with an explicit request to file a v2 issue; #57804 confirms that on v2.1.2 the same repeated read still produces no doom_loop prompt."},{name:"B · token-burn incidents",story:"The largest quantified losses. #45442: a subagent issued <b>364 identical greps</b> over 50 minutes — <b>142M cache-read tokens</b>, invisible to the parent session. #47253: 22M tokens on one Excel task. #49042: 525 steps / 66 minutes with zero user input. #52092: a runaway loop drained an entire monthly Go allowance, and killing the process didn't stop the billing. Note how many are closed <i>completed</i> or by the stale-bot."},{name:"C · text / reasoning loops",story:"Repetition with no tool call at all: reasoning loops (#12716, #14343), 'changes' that only happen in thinking (#15271), self-referential narration (#46249), intent announcements that never become calls (#46492). <b>Call-level detection cannot see these</b> — they are the next frontier, and out of scope for this PR."},{name:"D · adjacent root causes",story:"Also 'loops', but different machinery: auto-compaction fixed points (#15533, heavily discussed), rate-limit retries (#45989), provider 500 loops (#33006). Listed so the PR can explicitly scope them out."}],clTitle:"What this means for the PR",clBody:"① Demand keeps recurring, and the losses are quantified: reports span 11 months, with token damage in the hundreds of millions. ② #47759 remains open; #51965 and #52372 are now closed — #51965 was closed as v1-only with an explicit request to file a v2 issue, and #57804 supplies that fresh v2 evidence. ③ Four earlier PRs were closed by automation without review; #32089 received substantive review comments and was then closed by a maintainer. None merged, so process discipline matters. ④ Lane C/D are related but out of scope — the PR description says so explicitly.",tiles:[[String(jt.length),"loop-related issues",""],[String(jt.filter(e=>e.state==="open").length),"still open",""],["142M","worst single incident","cache-read tokens, #45442"],["11 mo","time span","recurring reports"]],monthAxis:"month",countAxis:"issues",tipSeg:(e,t,s)=>e+" · "+t+`

Child(B)})}return Dt(i),je(()=>t.t,i),(r,l)=>(O(),M(K,null,[h("div",{class:"legend",ref_key:"legend",ref:n},null,512),(O(),M("svg",{ref_key:"svg",ref:o,width:"100%",role:"img","aria-label":"Issues per month by theme"},null,512))],64))}},Ua={class:"card"},Fa=["innerHTML"],Da={class:"note"},qa={class:"issue-list"},Wa=["href"],Va={class:"date"},Ja={class:"ttl"},Ka={class:"eng"},Ga={key:0,class:"chip dmg"},Ya={__name:"LaneCard",props:{t:{type:Object,required:!0},lane:{type:Object,required:!0},index:{type:Number,required:!0},color:{type:String,required:!0}},setup(e){const t=e,s=jt.filter(o=>o.lane===t.index);return(o,n)=>(O(),M("div",Ua,[h("h3",null,[h("span",{class:"lane-dot",style:ft({background:e.color})},null,4),h("span",null,k(e.lane.name)+" · "+k(A(s).length),1)]),h("div",{class:"narrative",innerHTML:e.lane.story},null,8,Fa),h("div",Da,k(e.t.issueLabelsNote),1),h("div",qa,[(O(!0),M(K,null,ge(A(s),i=>(O(),M("div",{key:i.n,class:"issue-row"},[h("a",{class:"num",href:"https://github.com/anomalyco/opencode/issues/"+i.n,target:"_blank",rel:"noopener",style:ft({color:e.color})},"#"+k(i.n),13,Wa),h("span",Va,k(i.d),1),h("span",{class:le(["chip",i.state])},k(i.state==="open"?e.t.openChip:e.t.closedChip),3),h("span",Ja,k(i.t),1),h("span",Ka,k(e.t.engagement(i)),1),i.dmg?(O(),M("span",Ga,k(e.t.dmgChip)+k(i.dmg),1)):ze("",!0)]))),128))])]))}},Xa={class:"viz-root"},Za={class:"sub"},Qa=["innerHTML"],ec={__name:"Section2",setup(e){const{t}=as(ja),s=["var(--laneA)","var(--laneB)","var(--laneC)","var(--laneD)"],o=oe(()=>t.value.tiles.map(([n,i,r])=>({label:i,value:n,delta:r})));return(n,i)=>(O(),M("div",Xa,[h("h1",null,k(A(t).title),1),h("div",Za,k(A(t).sub),1),V(Mi,{items:o.value},null,8,["items"]),V(Ae,{title:A(t).chartTitle,note:A(t).chartNote},{default:ve(()=>[V(za,{t:A(t)},null,8,["t"])]),_:1},8,["title","note"]),(O(!0),M(K,null,ge(A(t).lanes,(r,l)=>(O(),Mt(Ya,{key:r.name,t:A(t),lane:r,index:l,color:s[l]},null,8,["t","lane","index","color"]))),128)),V(Ae,{class:"conclusion",title:A(t).clTitle},{default:ve(()=>[h("div",{class:"narrative",innerHTML:A(t).clBody},null,8,Qa)]),_:1},8,["title"])]))}},tc={en:{title:"How the three loop-detection signals work",sub:"A step-by-step visual explainer of the shipped detector (packages/core/src/plugin/doom-loop/detector.ts). Use the Next button in each stepper to watch each signal's counters evolve under the real rules. Example calls come from the real (anonymized) loop session; the B demo adds a synthetic one-new-line pattern to exercise the shipped tiers.",prev:"← Prev",next:"Next →",reset:"Reset",ruleTitle:"Detection rule derived from this session",ruleItems:["<b>Signature</b>: tool name + canonical JSON of the exact arguments (keys sorted; deliberately no bash-text normalization). A prototyped AST normalization (quote stripping, echo-separator removal — the grouping shown in the analysis above) remains a documented proposal, deferred to avoid widening the core detector's dependency surface. Cosmetic variants that escape A are caught by signal B.","<b>Evidence</b>: a call only counts toward a loop when its <i>result</i> is also identical. Re-running <code>git status</code> after an edit is legitimate. Re-running it into an unchanged tree is not.","<b>Thresholds</b>: the 3rd consecutive identical result appends a warning to the tool output. Once a signature's streak reaches 6, the <i>next</i> emission of that exact call is challenged with a <code>doom_loop</code> permission ask before it executes — the 6th itself still runs.","<b>A challenged call is never counted</b>: if denied it never executes, so nothing new is recorded. Retrying the same call just hits the same permission ask again — or passes silently when you saved an <code>always</code> answer for that signature. The escape hatch is the permission flow, not extra bookkeeping."],aTitle:"Signal A · per-signature identical-output streak",aBody:`<b>Each distinct command gets its own counter.</b> A signature = tool name + canonical JSON of the exact arguments (keys sorted, nothing more). Byte-level argument differences are different signatures: <code>git status "--short"</code> and <code>git status --short</code> count separately. An AST-based bash normalization (strip quotes, drop <code>echo</code> decorations) was prototyped and verified on real session data, and stays on the table as a documented proposal — but it would widen the core detector's dependency surface (tree-sitter in a zero-dependency module, or an expanded plugin service registry), so the shipped detector deliberately omits it. Variants that escape A are signal B's job. The critical part: <b>running a different command does NOT reset other commands' counters.</b> So in a rotation (A B C A B C), all three counters keep climbing. The global-streak detectors other agents use only track the most recent call. They reset to zero on every switch and never reach their threshold. <b>Warn at 3; once a streak reaches 6, the next emission is challenged.</b> Step through the rotation and watch the three counters:`,bTitle:"Signal B · information-novelty streak",cTitle:"Signal C · per-tool failure-equivalence streak",cBody:"<b>Why a third signal?</b> Consider the retry-then-read loop: the model tries an edit, it fails, reads the file (fresh output!), tweaks the args, fails again. <b>A is blind</b> — the tweaked args scatter the signatures. <b>B is blind</b> — every read brings novel lines and resets the global streak (and short reads are exempt anyway). So C counts differently: <b>per tool, consecutive equivalent failures</b>. Volatile tokens in the error text are normalized and then hashed: the same error under tweaked args counts, while a <i>different</i> error means the model is making progress and resets the streak. Interleaved successes of other tools (reads) do NOT reset it; any success of the same tool does — regardless of the target file. <b>Warn at 4; once the streak reaches 6, the tool's next emission is challenged.</b> Step through and watch all three counters at once:",cp1Title:"① key = tool name · equivalence = normalized error hash",cp1Cap:"tweaked args with the same error share one streak; a different error resets it (progress)",cp2Title:"② failures +1 · only a same-tool success resets",cp2Cap:"a successful read does NOT reset the failing edit's counter — otherwise the model could hide failures behind reads forever",cp3Title:"③ warn @4 · block @6 (the next emission is challenged)",cp3Cap:"earliest of the three signals for failing-call loops (#52372)",cOk:"✓ success",cFail:"✗ Error: old_string not found",cCellA:"A · this signature's count",cCellANote:e=>e===0?"0 — errors never feed A (only identical successful outputs count)":"counting…",cCellB:"B · novelty streak",cCellBNote:e=>e?"short read (<3 lines) — exempt from B":"errors feed C only — B never sees failure text",cCellC:"C · consecutive equivalent failures (edit)",cCellCNote:"reads don't touch it; any successful edit resets",cCellCFail:e=>e?"different error text → progress → reset to 1":"same normalized error → +1",cWarnText:"⚠ C warns: edit has failed 4 times in a row with the same error — the warning is appended to the error message",cBlockText:"⛔ C block: 6 consecutive equivalent failures — this edit emission is challenged with a doom_loop permission ask before it runs (the whole tool, any target)",cWhyNote:"This is exactly why C exists: A stayed at 0 (errors never feed it), B never moved — without C, this loop runs forever (community-reported, issue #52372 family).",bBody:"<b>Don't look at how the call is written — look at how much new information it brings back.</b> After every tool call:<br>① split the output into lines and drop separators.<br>② normalize volatile tokens (numbers, timestamps, durations → placeholders).<br>③ check each <i>distinct</i> line against the <b>session line store</b> — bounded: 10k lines with oldest-half FIFO eviction, tightened to 1000 when an execution ends.<br>④ <b>outputs shorter than 3 lines are exempt</b> — one-line receipts like edit/write confirmations never streak.<br><b>≥2 distinct novel lines, or ≥50% novel</b> (ratio against total lines) → the call was productive and resets <b>one single global counter</b>. Otherwise the counter grows. Command wording, variants and rotation are all irrelevant — only information counts. <b>Warn at 3, escalate at 5; at 8 the call is challenged — but only when its own A streak is ≥ 3: B never blocks alone. At 12 the circuit breaker hard-stops the session.</b>",storeLabel:"Session line store (bounded: 10k FIFO, per-line 1KB cap):",p1Title:"① split output into lines",p2Title:"② normalize volatile tokens",p3Title:"③ look up distinct lines in the bounded store",p3Cap:"Although the timing differs every run, the normalized line is identical to the stored one — noise never counts as novelty.",bColOut:"this call's output lines",bColStore:"session line store (hits highlighted)",storeEmpty:"(empty)",newTag:"✦ new",seenTag:"✓ seen",ruleCount:"≥2 distinct novel lines",ruleRatio:"≥50% novel of total",ruleCorr:e=>"A streak of this signature: "+e+" (block needs ≥ 3)",fpTitle:"Would it block legitimate work? (false-block analysis)",fpNote:"The design is deliberately <b>conservative</b>: a miss costs a few wasted calls, a false block interrupts real work. Here is how the common scenarios play out:",fpRiskTitle:"The two residual risks (stated honestly)",fpRisk:"<b>1. Side effects with constant output</b> — e.g. <code>make build</code> prints the same log but produces fresh artifacts, so B could miscount it as zero-gain. Mitigation: the streak also resets whenever the <b>filesystem actually changes</b> (opencode has snapshot tracking). Challenging only asks about the proven-fruitless signature — any other command still runs.<br><br><b>2. Watching a log for an event</b> — e.g. waiting for a deploy to finish while <code>tail</code> shows nothing new: zero-gain multi-line outputs climb the B streak (warn 3, escalate 5), and a challenge at 8 additionally needs that signature's A streak ≥ 3; at 12 the circuit breaker stops the drain until you speak. The first two tiers are text-only warnings that block nothing, and approving the ask (once, or always for that signature) keeps intentional polling running.",fpShieldTitle:"The final safeguard: challenging is not termination",fpShield:"Every enforcement tier is a <code>doom_loop</code> <b>permission ask</b>: deny refuses the call with an explanation to the model, allow (once, or always for that signature × signal) lets it through — so the user can pre-approve intentional polling. The session goes on: the model may run any other command, rephrase, or ask you. <b>A user message resets the global (B) streak and re-arms the circuit breaker — A and C intentionally survive, so a user interjection cannot hand the loop a fresh counter.</b> The worst case of a false challenge is <b>one interrupted tool call</b>, never a broken conversation. That is why the tiers exist on the global (B) streak: <b>3 = warn · 5 = escalate · 8 = challenge this signature (needs its A streak ≥ 3) · 12 = circuit breaker, hard stop</b>. Independently, a single signature whose own (A) streak reaches 6 is challenged on its next emission.",fpHead:["scenario","what the signals do","verdict"],fpRows:[["Edit a file, then re-run <code>git status</code>","Output has new lines → B: productive, streak resets; A: output differs, counter untouched","safe"],["Run the same <code>git status</code> twice, no changes","Streak reaches 1–2, far below the warning line at 3","safe"],["Re-run tests after a code change","Lots of new lines (new failures/results) → productive","safe"],["Test output ends with timing noise (<code>in 0.03s</code>)","Volatile tokens are normalized before comparison, so noise never counts as novelty","safe"],["<code>grep</code> finds nothing (empty output)","Empty output is under 3 lines → exempt from B; A sees a changed-then-constant output only if repeated identically","safe"],['User asked for periodic polling ("check the PR every 5 min")',"B warns — <b>by design</b>: the warning nudges the model to confirm with the user; a user reply resets the B streak, and approving the <code>doom_loop</code> ask (always) pre-authorizes the poll","by design"],["Health-check until a service is up (curl fails 5×, then succeeds)","C counts identical errors and warns at 4; a 6th identical failure would challenge the next curl emission — but any successful curl instantly resets C, proving it wasn't a loop. Tiers 3/5 are text-only; a genuine success resets C instantly","warn only"]],verdictText:{safe:"✓ safe","by design":"✓ by design","warn only":"⚠ warn only"},aWarn:e=>'⚠ warn: signature "'+e+'" has returned the identical result 3 times — appended to the tool output, execution continues',aArmed:e=>'⑥ signature "'+e+'" has now returned 6 identical results — it still executes, but its next emission will be challenged',aBlock:e=>'⛔ challenge: signature "'+e+'" returned 6 identical results — this 7th emission is stopped by a doom_loop permission ask before executing. Deny refuses it; allow (once / always for this signature) lets it through.',aCmpSame:"✓ byte-identical to this signature's last output → +1",aCmpFirst:"✦ first occurrence — counter starts at 1",aNotExec:"✗ challenged before execution — denied, so nothing executes and nothing is counted",aLedgerIdle:"not called — count kept",ap1Title:"① signature = tool + canonical JSON args",ap1Cap:"keys sorted, nothing more — quote variants count separately. AST normalization: prototyped, deferred (dependency cost); escaping variants fall to B",ap2Title:"② output compared byte-for-byte",ap2Cap:"identical result = no new information; a changed tree produces a different output and is NOT counted",ap3Title:"③ one independent counter per signature",ap3Cap:"switching commands never resets a counter — rotation cannot escape",aCounter:(e,t)=>e+": "+t,bVerdictOk:(e,t)=>"productive — "+e+"/"+t+" distinct lines novel → streak resets to 0",bVerdictBad:(e,t)=>"zero-gain — only "+e+"/"+t+" distinct lines novel (<2 and <50%) → streak +1",bVerdictExempt:e=>"exempt — "+e+" line(s) < 3: short outputs never feed B, streak unchanged",bVerdictBlocked:"challenged before execution — denied, so nothing executes and nothing is counted",bStreak:e=>"streak: "+e,bWarn:'⚠ warn @3: "the last few calls produced no new information. Before acting, write down what NEW information you expect."',bWarnHigh:'⚠ escalate @5: "these calls keep returning nothing new. Choose one: falsify your hypothesis, ask the user, or conclude with the evidence at hand."',bNoCorr:e=>"B ≥ 8, but this signature's A streak is only "+e+" (< 3) — B never blocks alone, the call passes",bBlock:"⛔ challenge: the global streak is ≥ 8 AND this signature's own A streak ≥ 3 — this emission is stopped by a doom_loop permission ask. Deny refuses it; allow/always lets it through.",stepOf:(e,t)=>"call "+e+" / "+t,mechTitle:"The full enforcement picture (what the three signals sit inside)",mechNote:"The steppers above show the three counters. The shipped detector wraps them in five more mechanisms — all verified against packages/core/src/plugin/doom-loop/.",mechItems:["<b>Same-message guard</b>: the exact same (tool, input) emitted a 3rd time within one assistant message is challenged exactly once per message (== 3, never ≥, so later high-tier prompts cannot be starved); when its A streak is ≥ 3 the two prompts merge into one. This is what catches bursts like issue #50678's 261 identical emissions in a single stream.","<b>Unobserved layer</b>: background shells and question calls abstain from A/B/C — their fixed receipt text would false-positive A instantly. The same unobserved signature ≥ 6 times earns a one-time prompt suggesting progress files or a status report. One declared exception: a background shell's <i>launch failure</i> carries no receipt metadata, so it is counted by signal C like any other failed call.","<b>Everything challenges via the <code>doom_loop</code> permission ask</b>: saved answers persist per signature × signal at project level (<code>:repeat</code> / <code>:unobserved</code> suffixes never exempt each other); non-interactive hosts auto-answer with feedback instead of hanging.","<b>Circuit breaker</b>: at a global (B) streak of 12 the drain is hard-interrupted — not an ask — and re-arms only when the user speaks.","<b>Lifecycle</b>: nothing is time-based — there is no idle sweep. After a restart the A/C counters and B's line store are rebuilt by folding the durable session history (blocked or declined calls persist as marked error parts and are skipped; injected warnings are stripped before hashing, so rebuilt counts match live accounting). bStreak resets to zero on restart (declared); the breaker cannot be folded and survives as one boolean in plugin KV (<code>circuit:&lt;session&gt;</code>) until a real user message or session.deleted clears it. Compaction resets A streaks and B's line store (C survives — failure equivalence needs no context); a user message resets B and the breaker only; the line store is bounded (10k FIFO, 1KB per line, tightened to 1000 at execution end). Capacity is bounded too: at most 64 tracked sessions (LRU; a dropped session re-folds on next touch), and at most 4096 signature / unobserved entries per session."]},zh:{title:"三个死循环检测信号是怎么工作的",sub:"对 shipped 检测器（packages/core/src/plugin/doom-loop/detector.ts）的一步一步图解。用「下一步」按钮观察各信号计数器在真实规则下的变化。示例调用来自真实的（已脱敏）循环会话；B 的演示在其基础上加了合成的一行新信息模式，以走完 shipped 的各个档位。",prev:"← 上一步",next:"下一步 →",reset:"重置",ruleTitle:"从本次会话推导出的检测规则",ruleItems:["<b>签名</b>：工具名 + 入参的 canonical JSON（键排序；有意不做 bash 文本归一化）。一个已验证原型的 AST 归一化（去引号、移除 echo 分隔符——即上文分析展示的分组）作为记录在案的提案保留；暂缓是为了不扩大核心检测器的依赖面。逃逸 A 的装饰变体由信号 B 拦截。","<b>证据</b>：只有结果也相同的调用才计入循环——编辑文件后再跑 <code>git status</code> 是合理的，对着没变的仓库反复跑才是问题。","<b>阈值</b>：第 3 次连续相同结果在工具输出后追加警告；当某签名的 streak 达到 6，该调用的<b>下一次</b>发射在执行前走 <code>doom_loop</code> 权限询问——第 6 次本身照常执行。","<b>被挑战的调用不计数</b>：被拒绝的调用不执行，因此不会有任何新记账；重试同一调用只会再次撞上同一个权限询问——如果你已为该签名保存 always 答案则静默放行。逃生门是权限流，而不是额外的计数机制。"],aTitle:"信号 A · 按签名统计相同输出",aBody:'<b>每条不同的命令各设一个计数器。</b>签名 = 工具名 + 入参的 canonical JSON（键排序，仅此而已）。逐字节的参数差异就是不同签名：<code>git status "--short"</code> 和 <code>git status --short</code> 分开计数。一个基于 AST 的 bash 归一化（去引号、剔除 <code>echo</code> 装饰）已做出原型并在真实会话数据上验证有效，作为记录在案的提案保留——但它会扩大核心检测器的依赖面（在零依赖模块里引入 tree-sitter，或扩大插件服务注册面），所以 shipped 的检测器有意不做。逃逸 A 的变体由信号 B 兜底。关键点在于：<b>换一条命令执行，不会把其它命令的计数器清零。</b>所以轮换（A B C A B C）时，三个计数器各自照样爬升。其它 Agent 用的全局计数器只记最近一次调用，每次换命令就清零，永远到不了阈值。<b>3 次警告；streak 到 6 后，下一次发射被挑战。</b>点「下一步」，看轮换中三个计数器各自爬升：',bTitle:"信号 B · 信息新颖度",cTitle:"信号 C · 按工具的失败等价计数",cBody:"<b>为什么还需要第三个信号？</b>看 retry-then-read 循环：模型改文件失败 → 读一下（输出是新鲜的！）→ 微调参数再改 → 又失败。<b>A 失明</b>——参数微调把签名全部打散；<b>B 失明</b>——每次 read 的新行都把全局 streak 清零（何况短输出本来就豁免）。所以 C 换个数法：<b>按工具计连续等价失败</b>。错误文本里的易变 token 先归一化再哈希：参数微调但错误相同 → 继续计数；错误<b>变了</b>说明模型在进步 → 清零。穿插的其它工具成功（read）<b>不</b>清零；同工具的任何成功都清零——不看目标文件。<b>4 连败警告；streak 到 6 后，该工具的下一次发射被挑战。</b>点「下一步」，同屏看三个计数器的命运：",cp1Title:"① key = 工具名 · 等价 = 归一化错误哈希",cp1Cap:"参数微调但错误相同 → 共享同一 streak；错误变了 → 有进展，清零",cp2Title:"② 失败 +1 · 仅同工具成功清零",cp2Cap:"成功的 read 不清零失败 edit 的计数器——否则模型能用 read 无限掩盖失败",cp3Title:"③ 4 连败警告 · 6 连败后下一次发射被挑战",cp3Cap:"失败重试类循环里三个信号中最早（#52372 型）",cOk:"✓ 成功",cFail:"✗ Error: old_string not found",cCellA:"A · 本签名计数",cCellANote:e=>e===0?"0——error 不进 A（只有成功的相同输出才计数）":"计数中…",cCellB:"B · 新颖度 streak",cCellBNote:e=>e?"短 read（<3 行）——对 B 豁免":"错误只进 C——B 永远看不到失败文本",cCellC:"C · 连续等价失败（edit）",cCellCNote:"read 不动它；edit 一旦成功就清零",cCellCFail:e=>e?"错误文本变了 → 有进展 → 归零重计":"归一化后错误相同 → +1",cWarnText:"⚠ C 警告：edit 已连续 4 次以相同错误失败——警告追加到 error.message 里",cBlockText:"⛔ C 拦截：连续 6 次等价失败——本次 edit 发射在执行前被 doom_loop 权限询问拦下（作用于整个工具，不分目标）",cWhyNote:"这正是 C 存在的理由：A 停在 0（error 不进 A）、B 始终没动——没有 C，这个循环会无限跑下去（社区已报告，#52372 家族）。",bBody:"<b>不看调用怎么写，只看它带回多少新信息。</b>每次工具调用后：<br>① 把输出按行拆开，去掉分隔线。<br>② 把数字/时间戳/时长等易变 token 归一化成占位符。<br>③ 每个<b>去重后</b>的行去<b>会话行库</b>查重——行库有界：10k 行 FIFO 淘汰最老一半，每次执行结束收紧到 1000 行。<br>④ <b>不足 3 行的输出整体豁免</b>——edit/write 的一行回执永远不会累计。<br><b>去重后新行 ≥2，或新行占比 ≥50%</b>（分母为总行数）→ 有产出，<b>全局唯一计数器</b>清零；否则计数器 +1。命令写法、变体、轮换统统不重要——只数信息。<b>3 警告、5 升级；到 8 挑战该调用——但前提是该签名自身的 A streak ≥3：B 永不单独拦截。到 12 熔断器硬停会话。</b>",storeLabel:"会话行库（有界：10k FIFO，单行 1KB 上限）：",p1Title:"① 输出拆成行",p2Title:"② 易变 token 归一化",p3Title:"③ 去重行在有界行库查重",p3Cap:"尽管每次运行耗时都不同，归一化后这行与历史中的完全相同——噪声永远不会被算成新信息。",bColOut:"本次调用的输出行",bColStore:"会话历史行库（命中行高亮）",storeEmpty:"（空）",newTag:"✦ 新",seenTag:"✓ 见过",ruleCount:"去重新行 ≥2",ruleRatio:"新行占总行数 ≥50%",ruleCorr:e=>"本签名 A streak："+e+"（拦截需 ≥3）",fpTitle:"会不会误拦正常工作？（误拦分析）",fpNote:"本设计刻意<b>偏保守</b>：漏检的代价是几次浪费的调用，误拦却会打断真实工作。常见场景逐个过：",fpRiskTitle:"两个残留风险（诚实说明）",fpRisk:"<b>1. 输出相同但有隐性副作用</b>——比如 <code>make build</code> 日志逐字相同但产物更新了，B 可能误判零增益。缓解：只要<b>文件系统发生实际变更</b>计数器就清零（opencode 有 snapshot 跟踪）。挑战只针对已被证明无产的那条签名，任何其它命令照常执行。<br><br><b>2. 守着日志等事件</b>——比如等部署完成而 <code>tail</code> 没有新内容：零增益的多行输出会推高 B streak（3 警告、5 升级），8 档的挑战还要求该签名 A streak ≥3；到 12 熔断器硬停整个 drain，直到你说话。前两档只是警告文本、什么都不拦；批准询问（一次或按签名 always）即可让有意轮询继续跑。",fpShieldTitle:"最后的兜底：挑战 ≠ 终止会话",fpShield:"所有处置档都是 <code>doom_loop</code> <b>权限询问</b>：deny 拒绝本次调用并把解释带给模型；allow（一次，或按签名 × 信号 always）放行——有意轮询可以被用户预先批准。会话继续：模型可以跑任何其它命令、换写法、或问你。<b>用户消息只清全局（B）streak 并重新武装熔断器——A 与 C 有意保留，用户插一句话不能把循环的计数器洗白。</b>误拦的最大代价是<b>一次工具调用被挑战</b>，而不是对话中断。这就是全局（B）streak 分级存在的原因：<b>3 = 警告 · 5 = 升级 · 8 = 挑战该签名（需其 A streak ≥3）· 12 = 熔断硬停</b>。此外，单个签名自身（A）的 streak 到 6 后，其下一次发射会被挑战。",fpHead:["场景","信号怎么处理","判定"],fpRows:[["编辑文件后重跑 <code>git status</code>","输出有新行（diff 变了）→ B：有产出，计数器清零；A：输出不同，不计数","safe"],["无改动连跑两次同样的 <code>git status</code>","streak 才 1–2，离警告线 3 还远","safe"],["改完代码重跑测试","大量新行（新的失败/结果）→ 有产出","safe"],["测试输出带时间噪声（<code>in 0.03s</code>）","易变 token 先归一化再比对，噪声不会被算成新信息","safe"],["<code>grep</code> 无结果（空输出）","空输出不足 3 行 → 对 B 豁免；A 也只在逐字节相同重现时才计数","safe"],["用户要求的轮询（「每 5 分钟看下 PR」）","B 会警告——<b>这是设计行为</b>：提醒文本引导模型向用户确认；用户回复清 B streak；批准 <code>doom_loop</code> 询问（always）即预授权轮询","by design"],["健康检查等服务就绪（curl 失败 5 次后成功）","C 累计相同错误并在第 4 次警告；第 6 次相同失败会让下一次 curl 发射被询问——但任何一次 curl 成功都会立刻清零 C，自证非循环。3/5 档只是文本；真正的成功会立刻清零 C","warn only"]],verdictText:{safe:"✓ 安全","by design":"✓ 设计行为","warn only":"⚠ 仅警告"},aWarn:e=>"⚠ 警告：签名「"+e+"」已连续 3 次返回相同结果——警告追加到工具输出中，继续执行",aArmed:e=>"⑥ 签名「"+e+"」已连续 6 次返回相同结果——本次仍正常执行，但其下一次发射将被挑战",aBlock:e=>"⛔ 挑战：签名「"+e+"」已连续 6 次返回相同结果——这第 7 次发射在执行前被 doom_loop 权限询问拦下。deny 拒绝；allow（一次 / 按签名 always）放行。",aCmpSame:"✓ 与该签名上次输出逐字节相同 → +1",aCmpFirst:"✦ 首次出现——计数器从 1 开始",aNotExec:"✗ 执行前被挑战——deny 后没有执行，也不记入任何计数",aLedgerIdle:"未调用 · 计数保留",ap1Title:"① 签名 = 工具 + 规范化 JSON 参数",ap1Cap:"仅键排序——引号变体分开计数。AST 归一化：已验证原型，暂缓（依赖面代价）；逃逸变体由 B 兜底",ap2Title:"② 输出逐字节比对",ap2Cap:"结果相同 = 没有新信息；仓库变了输出就不同，不计数",ap3Title:"③ 每个签名一个独立计数器",ap3Cap:"换命令不清零——轮换无法逃逸",aCounter:(e,t)=>e+"："+t,bVerdictOk:(e,t)=>"有产出——"+e+"/"+t+" 个去重行是新信息 → streak 清零",bVerdictBad:(e,t)=>"零增益——只有 "+e+"/"+t+" 个去重行新（<2 且 <50%）→ streak +1",bVerdictExempt:e=>"豁免——"+e+" 行 < 3：短输出不进 B，streak 不变",bVerdictBlocked:"在执行前被挑战——deny 后不执行、不计数",bStreak:e=>"streak："+e,bWarn:"⚠ 第 3 次警告：「最近几次调用没有产生任何新信息。行动前，先写下你期望获得什么新信息。」",bWarnHigh:"⚠ 第 5 次升级：「这些重复调用一直没有带回新东西。三选一：证伪当前假设、向用户要缺失的输入、或基于已有证据收束。」",bNoCorr:e=>"B ≥ 8，但该签名的 A streak 只有 "+e+"（<3）——B 永不单独拦截，调用放行",bBlock:"⛔ 挑战：全局 streak ≥ 8 且该签名自身 A streak ≥ 3——本次发射被 doom_loop 权限询问拦下。deny 拒绝；allow/always 放行。",stepOf:(e,t)=>"第 "+e+" 次 / 共 "+t+" 次",mechTitle:"完整的执行图景（三个信号之外包裹的机制）",mechNote:"上面的 stepper 展示了三个计数器。shipped 检测器在外层还包着五组机制——全部可在 packages/core/src/plugin/doom-loop/ 对照源码。",mechItems:["<b>同消息守卫</b>：同一条 assistant 消息内相同 (tool, input) 恰好第 3 次发射时被挑战一次（== 3 而非 ≥，之后不再问，避免饿死后续高档位提示）；若其 A streak ≥3 则两条提示合并。这正是拦 #50678「单流 261 次相同发射」的那一层。","<b>不可观测层</b>：后台 shell 与 question 调用弃权 A/B/C——它们的固定回执文本会立刻误触 A。同一不可观测签名 ≥6 次后给一次性提示，引导写进度文件或直接向用户汇报。一个已声明的例外：后台 shell 的<b>启动失败</b>没有回执 metadata，因此会像其它失败调用一样计入信号 C。","<b>一切处置都走 <code>doom_loop</code> 权限询问</b>：保存的答案按签名 × 信号在项目级持久化（<code>:repeat</code> / <code>:unobserved</code> 后缀互不免除）；无交互的宿主自动应答并带反馈，不会挂起。","<b>熔断器</b>：全局（B）streak 到 12 时硬中断整个 drain——不是询问——直到用户说话才重新武装。",'<b>生命周期</b>：没有任何按时间的判据——闲置清扫已废除。重启后 A/C 计数器与 B 行库由 durable 会话历史 fold 重建（被拦/被拒的调用以带 <code>doom_loop: "blocked"</code> 标记的 error ut ×3"},p32089:{name:"#32089",sub:"whole-history cumulative ≥3"},oursB:{name:"ours B · novelty",sub:"global info-novelty streak"},oursA:{name:"ours A · per-signature",sub:"per-signature identical output"},p47797:{name:"#47797",sub:"streaming period blocks (per drain)"},p47845:{name:"#47845",sub:"single-message period blocks"},p46272:{name:"#46272",sub:"10 consecutive identical, hard stop"},p37109:{name:"#37109",sub:"same-tool outcome fingerprint ×3"}},prRows:[["#32089 (+9/−12)","Whole-session cumulative count of identical signatures ≥ 3","call #7 — earliest","No window: legit commands like npm test run 3× hours apart would false-fire; O(history) DB reads per call"],["#47797 (+tests)","Ring buffer; per period p=1..10, fires when 3 consecutive blocks of length p match","call #39 (catches the period-3 phase)","Detector lives inside one drain — a user message resets it; re-asks permission every call after firing"],["#47845","Same idea but within a single assistant message","never","Single-message scope unsolved + O(n²) re-stringify per call; strictly worse twin of #47797, opened the same day"],["#46272","Last 10 calls in one user turn byte-identical → hard stop, no permission flow","never (rotation has no 10-run)","No user escape hatch, conflicts with doom_loop permission philosophy; closed by stale-bot, no review"],["#37109 (+929)","sha256 fingerprint of outcomes as the model saw them, ×3 per tool name; fingerprint-scoped permission patterns","never (all calls are bash, the three commands' outputs differ)","Most complete design. Process failure: template non-compliance → auto-closed in 2h. Large diff (+929), never reviewed."]],cmpTitle:"The loop replayed under four algorithms: the v1 baseline vs the three shipped signals",cmpNote:"Each panel replays the same "+_e.total+" loop calls under one algorithm. The curve is that algorithm's internal counter (capped so the chart stays readable). The strip below shows each call. The greyed-out region marks everything that would have been <b>prevented</b> after the first block.",cmpAT:"A · per-signature identical-output streak (warn @3 · block @6)",cmpAN:"Each call counts how many times <b>its own signature</b> already returned the identical result. Interleaving other commands does <b>not</b> reset it, so the curve is a sawtooth that keeps climbing through the rotation. Strip colors = command families (same as the timeline).",cmpBT:"B · information-novelty streak (warn @3 · escalate @5 · ask @8 needs A≥3 · breaker @12)",cmpBN:"Each output of <b>3+ lines</b> is split, normalized (numbers/timestamps/durations → placeholders), deduped, and compared against the <b>bounded</b> session line store (10k FIFO). Grey ticks = exempt outputs (<3 lines) that never feed B. A productive call would be green and reset the counter; in this loop none do. <span style='color:var(--repeat)'>red</span> = zero new information. At streak 8 a call is challenged only when its own A streak is ≥ 3 — B never blocks alone; at 12 the circuit breaker hard-stops the session.",cmpCT:"C · per-tool failure-equivalence streak (warn @4 · block @6)",cmpCN:"A <span style='color:var(--repeat)'>red tick</span> is a failing call: same tool + same normalized error hash climbs the streak, a different error or any same-tool success resets it. <b>This loop never fails a single call</b> — all "+_e.total+" succeed — so the curve sits at 0 throughout. C exists for the other loop family: failure-retry storms like issue #52372 (the §3 C demo walks one).",cmpV1T:"v1 doom loop · the ported baseline (single message · exact input ×3)",cmpV1N:"The algorithm this PR replaces (v1.18.30 <code>processor.ts</code>): within a single assistant message, if the last 3 settled tool calls match the incoming call in tool + raw JSON input exactly, it asks — the 4th identical emission fires. The curve is the current message's trailing identical-input run. It <b>never leaves zero</b>: this loop rotates <i>across</i> messages and repeats nothing within one — the structural blind spot the rewrite exists to close.",cmpNever:"✗ never fires on this loop",cmpPrevented:e=>e+" calls prevented",cmpBlock:e=>"permission ask @ call #"+e,cmpCircuit:e=>"circuit breaker @ call #"+e+" — hard stop",cmpTipTitle:(e,t)=>"call #"+(t+1)+(e.exemptB?" · exempt (<3 lines)":e.prodB?" · productive":" · zero-gain"),cmpTipSub:e=>e.cmd+`
