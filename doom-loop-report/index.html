on misses cross-message repetitions, inverted filter order"},{n:23531,d:"2026-04-20",state:"closed",c:2,u:0,lane:0,t:"Make doom_loop repeat threshold configurable"},{n:32187,d:"2026-06-13",state:"closed",c:2,u:0,lane:0,t:"Improve doom loop detection granularity (args tweak bypasses it)"},{n:47759,d:"2026-09-07",state:"open",c:2,u:0,lane:0,t:"Doom-loop detection misses periodic tool-call cycles (A,B,A,B)"},{n:51965,d:"2026-09-29",state:"closed",c:5,u:0,lane:0,t:"doom_loop never fires when repeated calls span steps"},{n:56825,d:"2026-10-18",state:"closed",c:2,u:0,lane:0,t:"repetitive tool call loop blocks task completion; closed as duplicate of #45442"},{n:57804,d:"2026-10-21",state:"closed",c:4,u:0,lane:0,t:"v2.1.2 repeats the same read; user confirms no doom_loop prompt"},{n:3743,d:"2025-11-02",state:"closed",c:27,u:13,lane:1,t:"Loop in certain models (Kimi K2 / MiniMax / GLM-4.6)"},{n:26220,d:"2026-05-07",state:"closed",c:12,u:4,lane:1,t:"infinite loop after tool calls complete (Zen/big-pickle)"},{n:25270,d:"2026-05-01",state:"closed",c:25,u:4,lane:1,t:"Model generates identical response twice"},{n:31942,d:"2026-06-11",state:"closed",c:3,u:0,lane:1,t:"loops 277 times on MCP resource_list, no circuit breaker",dmg:"277 calls"},{n:43673,d:"2026-08-20",state:"closed",c:5,u:0,lane:1,t:"non-terminating loop, identical tool calls, identical outputs"},{n:43800,d:"2026-08-21",state:"closed",c:3,u:0,lane:1,t:"stuck in a tool-call loop, wasting tokens (deepseek-v4-flash)"},{n:43603,d:"2026-08-20",state:"closed",c:4,u:0,lane:1,t:"no no-progress detection during repeated file investigation"},{n:45442,d:"2026-08-27",state:"open",c:8,u:2,lane:1,t:"subagent: 364 identical greps, ~50min, invisible to parent session",dmg:"142M cache-read tokens"},{n:47253,d:"2026-09-04",state:"closed",c:2,u:0,lane:1,t:"DeepSeek-V4-Flash: ~22M tokens on one Excel task",dmg:"22M tokens"},{n:49042,d:"2026-09-14",state:"open",c:4,u:0,lane:1,t:"500+ steps, 66 min, zero user input — runaway auto-continue",dmg:"525 steps / 66 min"},{n:52092,d:"2026-09-29",state:"closed",c:2,u:0,lane:1,t:"runaway loop drained entire Go monthly allowance",dmg:"monthly quota gone"},{n:52372,d:"2026-09-30",state:"closed",c:2,u:0,lane:1,t:"loops indefinitely retrying a FAILING tool call (read on unrenderable image)"},{n:12716,d:"2026-02-08",state:"closed",c:10,u:3,lane:2,t:"Doom loop not caught during reasoning or output"},{n:14343,d:"2026-02-19",state:"closed",c:6,u:0,lane:2,t:"Kimi K2.5 frequently gets in a reiteration loop"},{n:15271,d:"2026-02-26",state:"closed",c:2,u:2,lane:2,t:"stuck in reasoning loop — 'changes' only in thinking"},{n:46030,d:"2026-08-28",state:"open",c:5,u:0,lane:2,t:"text loop without emitting tool calls (big-pickle)"},{n:46249,d:"2026-08-30",state:"closed",c:2,u:1,lane:2,t:"runaway self-referential loops in reasoning ('Let me run the grep…')"},{n:46492,d:"2026-08-31",state:"closed",c:2,u:0,lane:2,t:"intent-narration loop: announces a call, message ends, none sent"},{n:52763,d:"2026-10-02",state:"closed",c:2,u:0,lane:2,t:"output repetition loop across all providers"},{n:15533,d:"2026-03-01",state:"closed",c:27,u:12,lane:3,t:"auto-compaction infinite loop"},{n:27924,d:"2026-05-16",state:"closed",c:10,u:0,lane:3,t:"infinite compaction loop when compression fails"},{n:48827,d:"2026-09-13",state:"closed",c:2,u:0,lane:3,t:"auto-compaction loops forever (irreducible context)"},{n:52697,d:"2026-10-02",state:"closed",c:2,u:0,lane:3,t:"auto-compaction fixed point (never shrinks)"},{n:45989,d:"2026-08-28",state:"closed",c:12,u:1,lane:3,t:"infinite retry loop on rate limit"},{n:33006,d:"2026-06-19",state:"closed",c:4,u:0,lane:3,t:"OpenAI 500 server_error doom-loop"}],Ja={en:{title:"opencode community: the loop problem in issues",sub:`A curated set of loop-related issues in anomalyco/opencode (Nov 2025 → Oct 2026; issue states verified ${xs}). The chart shows posting frequency by theme; the cards below carry the narrative and the reviewed issue list.`,chartTitle:"Posts per month, stacked by theme",chartNote:"Posting accelerates sharply from Aug 2026 — the same period as the incident motivating this PR. Hover a segment for the issue numbers.",lanes:[{name:"A — detection gaps",story:"The community has pinpointed the v1 detector's blind spots, down to file and line: <b>cross-message repetitions never fire</b> (#51965, one day before the incident), <b>A,B,A,B rotations are invisible</b> (#47759, with a reproduction test attached), the threshold is hard-coded (#23531), and tweaking arguments bypasses matching (#32187). #25254 spelled out both bugs in May and was closed by the stale-bot, not by a fix. <b>Three of these match the incident's shape closely.</b><br><br>The freshest reports sharpen the current state: #56825 repeated one query dozens of times and was closed as a duplicate of #45442; #51965 was closed as v1-only with an explicit request to file a v2 issue; #57804 documents v2.1.2: the same read repeated until the user interrupted, with no doom_loop prompt; a session export is attached."},{name:"B — token-burn incidents",story:"The largest quantified losses. #45442: a subagent issued <b>364 identical greps</b> over 50 minutes — <b>142M cache-read tokens</b>, invisible to the parent session. #47253: 22M tokens on one Excel task. #49042: 525 steps / 66 minutes with zero user input. #52092: a runaway loop drained an entire monthly Go allowance, and killing the process didn't stop the billing. Note how many are closed <i>completed</i> or by the stale-bot."},{name:"C — text / reasoning loops",story:"Repetition with no tool call at all: reasoning loops (#12716, #14343), 'changes' that only happen in thinking (#15271), self-referential narration (#46249), intent announcements that never become calls (#46492). <b>Call-level detection cannot see these</b> — they are the next frontier, and out of scope for this PR."},{name:"D — adjacent root causes",story:"Also 'loops', but different machinery: auto-compaction fixed points (#15533, heavily discussed), rate-limit retries (#45989), provider 500 loops (#33006). Listed so the PR can explicitly scope them out."}],clTitle:"What this means for the PR",clBody:"<p>① Demand keeps recurring, and the losses are quantified: reports span 11 months, with token damage in the hundreds of millions.</p><p>② #47759 remains open; #51965 and #52372 are now closed — #51965 was closed as v1-only with an explicit request to file a v2 issue, and #57804 supplies that fresh v2 evidence.</p><p>③ Four earlier PRs were closed by automation without review; #32089 received substantive review comments and was then closed by a maintainer. None merged, so process discipline matters.</p><p>④ Lane C/D are related but out of scope — the PR description says so explicitly.</p>",tiles:[[String(jt.length),"loop-related issues",""],[String(jt.filter(e=>e.state==="open").length),"still open",""],["142M","worst single incident","cache-read tokens, #45442"],["11 mo","time span","recurring reports"]],monthAxis:"month",countAxis:"issues",tipSeg:(e,t,s)=>e+" — "+t+`
`+s.map(o=>"#"+o.n).join(", "),openChip:"open",closedChip:"closed",dmgChip:"loss: ",engagement:e=>e.c+" comments — "+e.u+" 👍",issueLabelsNote:"Issue titles below are short paraphrases; open the link for the original title.",issueStateNote:`Issue states and counts are a snapshot from ${xs}; open any issue link for its live GitHub status.`},zh:{title:"opencode 社区：issue 里的循环问题全景",sub:`anomalyco/opencode 中循环相关 issue 的调研样本（2025-11 → 2026-10；issue 状态与互动数核验于 ${xs}）。上图展示各主题的发帖频率；下方四个主题卡片承载解读与已审清单。`,chartTitle:"每月发帖数（按主题堆叠）",chartNote:"2026 年 8 月起发帖明显加速——与本 PR 起因事故的时段重合。悬停柱段看对应 issue 编号。",lanes:[{name:"A — 检测缺陷",story:"社区已把 v1 检测器的盲区精确到文件和行：<b>跨消息永不触发</b>（#51965，就在该事故前一天）、<b>A,B,A,B 轮换完全漏检</b>（#47759，附可复现测试）、阈值硬编码（#23531）、参数微调即绕过（#32187）。#25254 五月就写明了这两个 bug，被 stale-bot 关掉而不是被修复。<b>其中三个与该事故循环的形态高度吻合。</b><br><br>最新报告把当前状态钉得更死：#56825 同一查询重复几十次后被关成 #45442 的重复；#51965 以「v1 不修、v2 请开新 issue」关闭；#57804 记录 v2.1.2：同一 read 重复到用户打断才停，没有 doom_loop 提示，附 session 导出。"},{name:"B — 烧 token 事故",story:"全是量化损失。#45442：subagent 连续 <b>364 次相同 grep</b>、50 分钟、<b>142M cache-read tokens</b>，父会话无从察觉。#47253：一个 Excel 任务 22M tokens。#49042：525 步 / 66 分钟零用户输入。#52092：失控循环烧光整月 Go 额度，杀进程都止不住计费。注意其中多少是 stale-bot 关掉的。"},{name:"C — 文本/推理循环",story:"根本没有工具调用的重复：推理循环（#12716、#14343）、只在 thinking 里「改代码」（#15271）、自指叙述循环（#46249）、宣告要调工具但从未发出（#46492）。<b>调用级检测对它们全部失明</b>——这是下一个前沿，不在本 PR 范围内。"},{name:"D — 相邻根因",story:"也叫「循环」但机制不同：auto-compaction 不动点（#15533，讨论度很高）、限流重试（#45989）、provider 500 循环（#33006）。列出来是为了让 PR 明确把它们划在范围外。"}],clTitle:"对 PR 的意义",clBody:"<p>① 需求持续复发且有量化损失——报告跨度 11 个月，单帖损失可达数亿 token。</p><p>② #47759 仍 open；#51965 与 #52372 已关闭——#51965 的关闭理由是「v1 不修、v2 请开新 issue」，#57804 正好补上了这份 v2 新证据。</p><p>③ 较早的四个 PR 被自动化流程关闭、未获 review；#32089 收到过实质 review 意见，随后由维护者关闭。五个都未合入，所以 PR 流程纪律必须放第一位。</p><p>④ C/D 两组与本 PR 相关但在范围外——PR 描述里已明确划出。</p>",tiles:[[String(jt.length),"循环相关 issue",""],[String(jt.filter(e=>e.state==="open").length),"仍 open",""],["142M","最严重单帖损失","cache-read tokens，#45442"],["11 个月","时间跨度","持续有报告"]],monthAxis:"月份",countAxis ,R.append(I,q),n.value.appendChild(R)})}return qt(i),ze(()=>t.t,i),(r,l)=>(E(),L(K,null,[p("div",{class:"legend",ref_key:"legend",ref:n},null,512),(E(),L("svg",{ref_key:"svg",ref:o,width:"100%",role:"img","aria-label":"Issues per month by theme"},null,512))],64))}},Ga={class:"card"},Xa=["innerHTML"],Ya={class:"note"},Za={class:"issue-list"},Qa=["href"],ec={class:"date"},tc=["href"],sc={class:"ttl"},oc={class:"eng"},nc={key:0,class:"chip dmg"},ic={__name:"LaneCard",props:{t:{type:Object,required:!0},lane:{type:Object,required:!0},index:{type:Number,required:!0},color:{type:String,required:!0}},setup(e){const t=e,s=jt.filter(o=>o.lane===t.index);return(o,n)=>(E(),L("div",Ga,[p("h3",null,[p("span",{class:"lane-dot",style:it({background:e.color})},null,4),p("span",null,v(e.lane.name)+", "+v(_(s).length),1)]),p("div",{class:"narrative",innerHTML:e.lane.story},null,8,Xa),p("div",Ya,v(e.t.issueLabelsNote)+" "+v(e.t.issueStateNote),1),p("div",Za,[(E(!0),L(K,null,fe(_(s),i=>(E(),L("div",{key:i.n,class:"issue-row"},[p("a",{class:"num",href:"https://github.com/anomalyco/opencode/issues/"+i.n,target:"_blank",rel:"noopener",style:it({color:e.color})},"#"+v(i.n),13,Qa),p("span",ec,v(i.d),1),p("a",{class:ie(["chip",i.state]),href:"https://github.com/anomalyco/opencode/issues/"+i.n,target:"_blank",rel:"noopener"},v(i.state==="open"?e.t.openChip:e.t.closedChip),11,tc),p("span",sc,v(i.t),1),p("span",oc,v(e.t.engagement(i)),1),i.dmg?(E(),L("span",nc,v(e.t.dmgChip)+v(i.dmg),1)):je("",!0)]))),128))])]))}},lc={class:"viz-root"},rc={class:"sub"},ac=["innerHTML"],cc={__name:"Section2",setup(e){const{t}=kt(Ja),s=["var(--laneA)","var(--laneB)","var(--laneC)","var(--laneD)"],o=se(()=>t.value.tiles.map(([n,i,r])=>({label:i,value:n,delta:r})));return(n,i)=>(E(),L("div",lc,[p("h1",null,v(_(t).title),1),p("div",rc,v(_(t).sub),1),J(Hi,{items:o.value},null,8,["items"]),J(Ae,{title:_(t).chartTitle,note:_(t).chartNote},{default:ye(()=>[J(Ka,{t:_(t)},null,8,["t"])]),_:1},8,["title","note"]),(E(!0),L(K,null,fe(_(t).lanes,(r,l)=>(E(),Ot(ic,{key:r.name,t:_(t),lane:r,index:l,color:s[l]},null,8,["t","lane","index","color"]))),128)),J(Ae,{class:"conclusion",title:_(t).clTitle},{default:ye(()=>[p("div",{class:"narrative",innerHTML:_(t).clBody},null,8,ac)]),_:1},8,["title"])]))}},dc={en:{title:"How the implemented detection algorithm works",sub:"A step-by-step visual explainer of the implementation in packages/core/src/plugin/doom-loop/detector.ts. Use the Next button in each stepper to watch each signal's counters evolve under the real rules. Example calls come from the real (anonymized) loop session; the B demo adds a synthetic one-new-line pattern to exercise the implemented tiers.",prev:"← Prev",next:"Next →",reset:"Reset",ruleTitle:"Detection rule derived from this session",ruleItems:["<b>Signature</b>: tool name + canonical JSON of the exact arguments (keys sorted; deliberately no bash-text normalization). A prototyped AST normalization (quote stripping, echo-separator removal — the grouping shown in the analysis above) remains a documented proposal, deferred to avoid widening the core detector's dependency surface. Cosmetic variants that escape A are caught by signal B.","<b>Evidence</b>: a call only counts toward a loop when its <i>result</i> is also identical. Re-running <code>git status</code> after an edit is legitimate. Re-running it into an unchanged tree is not.","<b>Thresholds</b>: the 3rd consecutive identical result appends a warning to the tool output. Once a signature's streak reaches 6, the <i>next</i> emission of that exact call is challenged with a <code>doom_loop</code> permission ask before it executes — the 6th itself still runs.","<b>A challenged call is never counted</b>: if denied it never executes, so nothing new is recorded. Retrying the same call just hits the same permission ask again — or passes silently when you saved an <code>always</code> answer for that signature. The escape hatch is the permission flow, not extra bookkeeping."],aTitle:"Signal A — per-signature identical-output streak",aBody:`<b>Each distinct command gets its own counter.</b> A signature = tool name + canonical JSON of the exact arguments (keys sorted, nothing more). Byte-level argument differences are different signatures: <code>git status "--short"</code> and <code>git status --short</code> count separately. An AST-based bash normalization (strip quotes, drop <code>echo</code> decorations) was prototyped and verified on real session data, and stays on the table as a documented proposal — but it would widen the core detector's dependency surface (tree-sitter in a zero-dependency module, or an expanded plugin service registry), so the implemented detector deliberately omits it. Variants that escape A are signal B's job. The critical part: <b>running a different command does NOT reset other commands' counters.</b> So in a rotation (A B C A B C), all three counters keep climbing. The global-streak detectors other agents use only track the most recent call. They reset to zero on every switch and never reach their threshold.<br><br><b>Warn at 3; once a streak reaches 6, the next emission is challenged.</b> Step through the rotation and watch the three counters:`,bTitle:"Signal B — information-novelty streak",cTitle:"Signal C — per-tool failure-equivalence streak",cBody:"<b>Why a third signal?</b> Consider the retry-then-read loop: the model tries an edit, it fails, reads the file (fresh output!), tweaks the args, fails again. <b>A is blind</b> — the tweaked args scatter the signatures. <b>B is blind</b> — every read brings novel lines and resets the global streak (and short reads are exempt anyway). So C counts differently: <b>per tool, consecutive equivalent failures</b>. Volatile tokens in the error text are normalized and then hashed: the same error under tweaked args counts, while a <i>different</i> error means the model is making progress and resets the streak. Interleaved successes of other tools (reads) do NOT reset it; any success of the same tool does — regardless of the target file.<br><br><b>Warn at 4; once the streak reaches 6, the tool's next emission is challenged.</b> Step through and watch all three counters at once:",cp1Title:"① key = tool name — equivalence = normalized error hash",cp1Cap:"tweaked args with the same error share one streak; a different error resets it (progress)",cp2Title:"② failures +1 — only a same-tool success resets",cp2Cap:"a successful read does NOT reset the failing edit's counter — otherwise the model could hide failures behind reads forever",cp3Title:"③ warn @4 — block @6 (the next emission is challenged)",cp3Cap:"earliest of the three signals for failing-call loops (#52372)",cOk:"✓ success",cFail:"✗ Error: old_string not found",cCellA:"A — this signature's count",cCellANote:e=>e===0?"0 — errors never feed A (only identical successful outputs count)":"counting…",cCellB:"B — novelty streak",cCellBNote:e=>e?"short read (<3 lines) — exempt from B":"errors feed C only — B never sees failure text",cCellC:"C — consecutive equivalent failures (edit)",cCellCNote:"reads don't touch it; any successful edit resets",cCellCFail:e=>e?"different error text → progress → reset to 1":"same normalized error → +1",cWarnText:"⚠ C warns: edit has failed 4 times in a row with the same error — the warning is appended to the error message",cBlockText:"⛔ C block: 6 consecutive equivalent failures — this edit emission is challenged with a doom_loop permission ask before it runs (the whole tool, any target)",cWhyNote:"This is exactly why C exists: A stayed at 0 (errors never feed it), B never moved — without C, this loop runs forever (community-reported, issue #52372 family).",bBody:"<b>Don't look at how the call is written — look at how much new information it brings back.</b> After every tool call:<br>① split the output into lines and drop separators.<br>② normalize volatile tokens (numbers, timestamps, durations → placeholders).<br>③ check each <i>distinct</i> line against the <b>session line store</b> — bounded: 10k lines with oldest-half FIFO eviction, tightened to 1000 when an execution ends.<br>④ <b>outputs shorter than 3 lines are exempt</b> — one-line receipts like edit/write confirmations never streak.<br><b>≥2 distinct novel lines, or ≥50% novel</b> (ratio against total lines) → the call was productive and resets <b>one single global counter</b>. Otherwise the counter grows.<br><br>Command wording, variants and rotation are all irrelevant — only information counts. <b>Warn at 3, escalate at 5; at 8 the call is challenged — but only when its own A streak is ≥ 3: B never blocks alone. At 12 the circuit breaker hard-stops the session.</b>",storeLabel:"Session line store (bounded: 10k FIFO, per-line 1KB cap):",p1Title:"① split output into lines",p2Title:"② normalize volatile tokens",p3Title:"③ look up distinct lines in the bounded store",p3Cap:"Although the timing differs every run, the normalized line is identical to the stored one — noise never counts as novelty.",bColOut:"this call's output lines",bColStore:"session line store (hits highlighted)",storeEmpty:"(empty)",newTag:"✦ new",seenTag:"✓ seen",ruleCount:"≥2 distinct novel lines",ruleRatio:"≥50% novel of total",ruleCorr:e=>"A streak of this signature: "+e+" (block needs ≥ 3)",fpTitle:"Would it block legitimate work? (false-block analysis)",fpNote:"The design is deliberately <b>conservative</b>: a miss costs a few wasted calls, a false block interrupts real work. Here is how the common scenarios play out:",fpRiskTitle:"The two residual risks (stated honestly)",fpRisk:"<b>1. Side effects with constant output</b> — e.g. <code>make build</code> prints the same log but produces fresh artifacts, so B could miscount it as zero-gain. Mitigation: the streak also resets whenever the <b>filesystem actually changes</b> (opencode has snapshot tracking). Challenging only asks about the proven-fruitless signature — any other command still runs.<br><br><b>2. Watching a log for an event</b> — e.g. waiting for a deploy to finish while <code>tail</code> shows nothing new: zero-gain multi-line outputs climb the B streak (warn 3, escalate 5), and a challenge at 8 additionally needs that signature's A streak ≥ 3; at 12 the circuit breaker stops the drain until you speak. The first two tiers are text-only warnings that block nothing, and approving the ask (once, or always for that signature) keeps intentional polling running.",fpShieldTitle:"The final safeguard: challenging is not termination",fpShield:"Every enforcement tier is a <code>doom_loop</code> <b>permission ask</b>: deny refuses the call with an explanation to the model, allow (once, or always for that signature × signal) lets it through — so the user can pre-approve intentional polling. The session goes on: the model may run any other command, rephrase, or ask you.<br><br><b>A user message resets the global (B) streak and re-arms the circuit breaker — A and C intentionally survive, so a user interjection cannot hand the loop a fresh counter.</b> The worst case of a false challenge is <b>one interrupted tool call</b>, never a broken conversation. That is why the tiers exist on the global (B) streak: <b>3 = warn — 5 = escalate — 8 = challenge this signature (needs its A streak ≥ 3) — 12 = circuit breaker, hard stop</b>. Independently, a single signature whose own (A) streak reaches 6 is challenged on its next emission.",fpHead:["scenario","what the signals do","verdict"],fpRows:[["Edit a file, then re-run <code>git status</code>","Output has new lines → B: productive, streak resets; A: output differs, counter untouched","safe"],["Run the same <code>git status</code> twice, no changes","Streak reaches 1–2, far below the warning line at 3","safe"],["Re-run tests after a code change","Lots of new lines (new failures/results) → productive","safe"],["Test output ends with timing noise (<code>in 0.03s</code>)","Volatile tokens are normalized before comparison, so noise never counts as novelty","safe"],["<code>grep</code> finds nothing (empty output)","Empty output is under 3 lines → exempt from B; A sees a changed-then-constant output only if repeated identically","safe"],['User asked for periodic polling ("check the PR every 5 min")',"B warns — <b>by design</b>: the warning nudges the model to confirm with the user; a user reply resets the B streak, and approving the <code>doom_loop</code> ask (always) pre-authorizes the poll","by design"],["Health-check until a service is up (curl fails 5×, then succeeds)","C counts identical errors and warns at 4; a 6th identical failure would challenge the next curl emission — but any successful curl instantly resets C, proving it wasn't a loop. Tiers 3/5 are text-only; a genuine success resets C instantly","warn only"]],verdictText:{safe:"✓ safe","by design":"✓ by design","warn only":"⚠ warn only"},aWarn:e=>'⚠ warn: signature "'+e+'" has returned the identical result 3 times — appended to the tool output, execution continues',aArmed:e=>'⑥ signature "'+e+'" has now returned 6 identical results — it still executes, but its next emission will be challenged',aBlock:e=>'⛔ challenge: signature "'+e+'" returned 6 identical results — this 7th emission is stopped by a doom_loop permission ask before executing. Deny refuses it; allow (once / always for this signature) lets it through.',aCmpSame:"✓ byte-identical to this signature's last output → +1",aCmpFirst:"✦ first occurrence — counter starts at 1",aNotExec:"✗ challenged before execution — denied, so nothing executes and nothing is counted",aLedgerIdle:"not called — count kept",ap1Title:"① signature = tool + canonical JSON args",ap1Cap:"keys sorted, nothing more — quote variants count separately. AST normalization: prototyped, deferred (dependency cost); escaping variants fall to B",ap2Title:"② output compared byte-for-byte",ap2Cap:"identical result = no new information; a changed tree produces a different output and is NOT counted",ap3Title:"③ one independent counter per signature",ap3Cap:"switching commands never resets a counter — rotation cannot escape",aCounter:(e,t)=>e+": "+t,bVerdictOk:(e,t)=>"productive — "+e+"/"+t+" distinct lines novel → streak resets to 0",bVerdictBad:(e,t)=>"zero-gain — only "+e+"/"+t+" distinct lines novel (<2 and <50%) → streak +1",bVerdictExempt:e=>"exempt — "+e+" line(s) < 3: short outputs never feed B, streak unchanged",bVerdictBlocked:"challenged before execution — denied, so nothing executes and nothing is counted",bStreak:e=>"streak: "+e,bWarn:'⚠ warn @3: "the last few calls produced no new information. Before acting, write down what NEW information you expect."',bWarnHigh:'⚠ escalate @5: "these calls keep returning nothing new. Choose one: falsify your hypothesis, ask the user, or conclude with the evidence at hand."',bNoCorr:e=>"B ≥ 8, but this signature's A streak is only "+e+" (< 3) — B never blocks alone, the call passes",bBlock:"⛔ challenge: the global streak is ≥ 8 AND this signature's own A streak ≥ 3 — this emission is stopped by a doom_loop permission ask. Deny refuses it; allow/always lets it through.",stepOf:(e,t)=>"call "+e+" / "+t,mechTitle:"The full enforcement picture (what the three signals sit inside)",mechNote:"The steppers above show the three counters. The current implementation wraps them in five more mechanisms — all verified against packages/core/src/plugin/doom-loop/.",mechItems:["<b>Same-message guard</b>: the exact same (tool, input) emitted a 3rd time within one assistant message is challenged exactly once per message (== 3, never ≥, so later high-tier prompts cannot be starved); when its A streak is ≥ 3 the two prompts merge into one. This is what catches bursts like issue #50678's 261 identical emissions in a single stream.","<b>Unobserved layer</b>: background shells and question calls abstain from A/B/C — their fixed receipt text would false-positive A instantly. The same unobserved signature ≥ 6 times earns a one-time prompt suggesting progress files or a status report. One declared exception: a background shell's <i>launch failure</i> carries no receipt metadata, so it is counted by signal C like any other failed call.","<b>Everything challenges via the <code>doom_loop</code> permission ask</b>: saved answers persist per signature × signal at project level (<code>:repeat</code> / <code>:unobserved</code> suffixes never exempt each other); non-interactive hosts auto-answer with feedback instead of hanging.","<b>Circuit breaker</b>: at a global (B) streak of 12 the drain is hard-interrupted — not an ask — and re-arms only when the user speaks.","<b>Lifecycle</b>: nothing is time-based — there is no idle sweep. After a restart the A/C counters and B's line store are rebuilt by folding the durable session history (blocked or declined calls persist as marked error parts and are skipped; injected warnings are stripped before hashing, so rebuilt counts match live accounting). bStreak resets to zero on restart (declared); the breaker cannot be folded and survives as one boolean in plugin KV (<code>circuit:&lt;session&gt;</code>) until a real user message or session.deleted clears it. Compaction resets A streaks and B's line store (C survives — failure equivalence needs no context); a user message resets B and the breaker only; the line store is bounded (10k FIFO, 1KB per line, tightened to 1000 at execution end). Capacity is bounded too: at most 64 tracked sessions (LRU; a dropped session re-folds on next touch), and at most 4096 signature / unobserved entries per session."]},zh:{title:"我们实现的检测算法图解",sub:"对当前实现（packages/core/src/plugin/doom-loop/detector.ts）的一步一步图解。用「下一步」按钮观察各信号计数器在真实规则下的变化。示例调用来自真实的（已脱敏）循环会话；B 的演示在其基础上加了合成的一行新信息模式，以走完当前实现的各个档位。",prev:"← 上一步",next:"下一步 →",reset:"重置",ruleTitle:"从本次会话推导出的检测规则",ruleItems:["<b>签名</b>：工具名 + 入参的 canonical JSON（键排序；有意不做 bash 文本归一化）。一个已验证原型的 AST 归一化（去引号、移除 echo 分隔符——即上文分析展示的分组）作为记录在案的提案保留；暂缓是为了不扩大核心检测器的依赖面。逃逸 A 的装饰变体由信号 B 拦截。","<b>证据</b>：只有结果也相同的调用才计入循环——编辑文件后再跑 <code>git status</code> 是合理的，对着没变的仓库反复跑才是问题。","<b>阈值</b>：第 3 次连续相同结果在工具输出后追加警告；当某签名的 streak 达到 6，该调用的<b>下一次</b>发射在执行前走 <code>doom_loop</code> 权限询问——第 6 次本身照常执行。","<b>被挑战的调用不计数</b>：被拒绝的调用不执行，因此不会有任何新记账；重试同一调用只会再次撞上同一个权限询问——如果你已为该签名保存 always 答案则静默放行。逃生门是权限流，而不是额外的计数机制。"],aTitle:"信号 A — 按签名统计相同输出",aBody:'<b>每条不同的命令各设一个计数器。</b>签名 = 工具名 + 入参的 canonical JSON（键排序，仅此而已）。逐字节的参数差异就是不同签名：<code>git status "--short"</code> 和 <code>git status --short</code> 分开计数。一个基于 AST 的 bash 归一化（去引号、剔除 <code>echo</code> 装饰）已做出原型并在真实会话数据上验证有效，作为记录在案的提案保留——但它会扩大核心检测器的依赖面（在零依赖模块里引入 tree-sitter，或扩大插件服务注册面），所以 当前实现有意不做。逃逸 A 的变体由信号 B 兜底。关键点在于：<b>换一条命令执行，不会把其它命令的计数器清零。</b>所以轮换（A B C A B C）时，三个计数器各自照样爬升。其它 Agent 用的全局计数器只记最近一次调用，每次换命令就清零，永远到不了阈值。<br><br><b>3 次警告；streak 到 6 后，下一次发射被挑战。</b>点「下一步」，看轮换中三个计数器各自爬升：',bTitle:"信号 B — 信息新颖度",cTitle:"信号 C — 按工具的失败等价计数",cBody:"<b>为什么还需要第三个信号？</b>看 retry-then-read 循环：模型改文件失败 → 读一下（输出是新鲜的！）→ 微调参数再改 → 又失败。<b>A 失明</b>——参数微调把签名全部打散；<b>B 失明</b>——每次 read 的新行都把全局 streak 清零（何况短输出本来就豁免）。所以 C 换个数法：<b>按工具计连续等价失败</b>。错误文本里的易变 token 先归一化再哈希：参数微调但错误相同 → 继续计数；错误<b>变了</b>说明模型在进步 → 清零。穿插的其它工具成功（read）<b>不</b>清零；同工具的任何成功都清零——不看目标文件。<br><br><b>4 连败警告；streak 到 6 后，该工具的下一次发射被挑战。</b>点「下一步」，同屏看三个计数器的命运：",cp1Title:"① key = 工具名 — 等价 = 归一化错误哈希",cp1Cap:"参数微调但错误相同 → 共享同一 streak；错误变了 → 有进展，清零",cp2Title:"② 失败 +1 — 仅同工具成功清零",cp2Cap:"成功的 read 不清零失败 edit 的计数器——否则模型能用 read 无限掩盖失败",cp3Title:"③ 4 连败警告 — 6 连败后下一次发射被挑战",cp3Cap:"失败重试类循环里三个信号中最早（#52372 型）",cOk:"✓ 成功",cFail:"✗ Error: old_string not found",cCellA:"A — 本签名计数",cCellANote:e=>e===0?"0——error 不进 A（只有成功的相同输出才计数）":"计数中…",cCellB:"B — 新颖度 streak",cCellBNote:e=>e?"短 read（<3 行）——对 B 豁免":"错误只进 C——B 永远看不到失败文本",cCellC:"C — 连续等价失败（edit）",cCellCNote:"read 不动它；edit 一旦成功就清零",cCellCFail:e=>e?"错误文本变了 → 有进展 → 归零重计":"归一化后错误相同 → +1",cWarnText:"⚠ C 警告：edit 已连续 4 次以相同错误失败——警告追加到 error.message 里",cBlockText:"⛔ C 拦截：连续 6 次等价失败——本次 edit 发射在执行前被 doom_loop 权限询问拦下（作用于整个工具，不分目标）",cWhyNote:"这正是 C 存在的理由：A 停在 0（error 不进 A）、B 始终没动——没有 C，这个循环会无限跑下去（社区已报告，#52372 家族）。",bBody:"<b>不看调用怎么写，只看它带回多少新信息。</b>每次工具调用后：<br>① 把输出按行拆开，去掉分隔线。<br>② 把数字/时间戳/时长等易变 token 归一化成占位符。<br>③ 每个<b>去重后</b>的行去<b>会话行库</b>查重——行库有界：10k 行 FIFO 淘汰最老一半，每次执行结束收紧到 1000 行。<br>④ <b>不足 3 行的输出整体豁免</b>——edit/write 的一行回执永远不会累计。<br><b>去重后新行 ≥2，或新行占比 ≥50%</b>（分母为总行数）→ 有产出，<b>全局唯一计数器</b>清零；否则计数器 +1。<br><br>命令写法、变体、轮换统统不重要——只数信息。<b>3 警告、5 升级；到 8 挑战该调用——但前提是该签名自身的 A streak ≥3：B 永不单独拦截。到 12 熔断器硬停会话。</b>",storeLabel:"会话行库（有界：10k FIFO，单行 1KB 上限）：",p1Title:"① 输出拆成行",p2Title:"② 易变 token 归一化",p3Title:"③ 去重行在有界行库查重",p3Cap:"尽管每次运行耗时都不同，归一化后这行与历史中的完全相同——噪声永远不会被算成新信息。",bColOut:"本次调用的输出行",bColStore:"会话历史行库（命中行高亮）",storeEmpty:"（空）",newTag:"✦ 新",seenTag:"✓ 见过",ruleCount:"去重新行 ≥2",ruleRatio:"新行占总行数 ≥50%",ruleCorr:e=>"本签名 A streak："+e+"（拦截需 ≥3）",fpTitle:"会不会误拦正常工作？（误拦分析）",fpNote:"本设计刻意<b>偏保守</b>：漏检的代价是几次浪费的调用，误拦却会打断真实工作。常见场景逐个过：",fpRiskTitle:"两个残留风险（诚实说明）",fpRisk:"<b>1. 输出相同但有隐性副作用</b>——比如 <code>make build</code> 日志逐字相同但产物更新了，B 可能误判零增益。缓解：只要<b>文件系统发生实际变更</b>计数器就清零（opencode 有 snapshot 跟踪）。挑战只针对已被证明无产的那条签名，任何其它命令照常执行。<br><br><b>2. 守着日志等事件</b>——比如等部署完成而 <code>tail</code> 没有新内容：零增益的多行输出会推高 B streak（3 警告、5 升级），8 档的挑战还要求该签名 A streak ≥3；到 12 熔断器硬停整个 drain，直到你说话。前两档只是警告文本、什么都不拦；批准询问（一次或按签名 always）即可让有意轮询继续跑。",fpShieldTitle:"最后的兜底：挑战 ≠ 终止会话",fpShield:"所有处置档都是 <code>doom_loop</code> <b>权限询问</b>：deny 拒绝本次调用并把解释带给模型；allow（一次，或按签名 × 信号 always）放行——有意轮询可以被用户预先批准。会话继续：模型可以跑任何其它命令、换写法、或问你。<br><br><b>用户消息只清全局（B）streak 并重新武装熔断器——A 与 C 有意保留，用户插一句话不能把循环的计数器洗白。</b>误拦的最大代价是<b>一次工具调用被挑战</b>，而不是对话中断。这就是全局（B）streak 分级存在的原因：<b>3 = 警告，5 = 升级，8 = 挑战该签名（需其 A streak ≥3），12 = 熔断硬停</b>。此外，单个签名自身（A）的 streak 到 6 后，其下一次发射会被挑战。",fpHead:["场景","信号怎么处理","判定"],fpRows:[["编辑文件后重跑 <code>git status</code>","输出有新行（diff 变了）→ B：有产出，计数器清零；A：输出不同，不计数","safe"],["无改动连跑两次同样的 <code>git status</code>","streak 才 1–2，离警告线 3 还远","safe"],["改完代码重跑测试","大量新行（新的失败/结果）→ 有产出","safe"],["测试输出带时间噪声（<code>in 0.03s</code>）","易变 token 先归一化再比对，噪声不会被算成新信息","safe"],["<code>grep</code> 无结果（空输出）","空输出不足 3 行 → 对 B 豁免；A 也只在逐字节相同重现时才计数","safe"],["用户要求的轮询（「每 5 分钟看下 PR」）","B 会警告——<b>这是设计行为</b>：提醒文本引导模型向用户确认；用户回复清 B streak；批准 <code>doom_loop</code> 询问（always）即预授权轮询","by design"],["健康检查等服务就绪（curl 失败 5 次后成功）","C 累计相同错误并在第 4 次警告；第 6 次相同失败会让下一次 curl 发射被询问——但任何一次 curl 成功都会立刻清零 C，自证非循环。3/5 档只是文本；真正的成功会立刻清零 C","warn only"]],verdictText:{safe:"✓ 安全","by design":"✓ 设计行为","warn only":"⚠ 仅警告"},aWarn:e=>"⚠ 警告：签名「"+e+"」已连续 3 次返回相同结果——警告追加到工具输出中，继续执行",aArmed:e=>"⑥ 签名「"+e+"」已连续 6 次返回相同结果——本次仍正常执行，但其下一次发射将被挑战",aBlock:e=>"⛔ 挑战：签名「"+e+"」已连续 6 次返回相同结果——这第 7 次发射在执行前被 doom_loop 权限询问拦下。deny 拒绝；allow（一次 / 按签名 always）放行。",aCmpSame:"✓ 与该签名上次输出逐字节相同 → +1",aCmpFirst:"✦ 首次出现——计数器从 1 开始",aNotExec:"✗ 执行前被挑战——deny 后没有执行，也不记入任何计数",aLedgerIdle:"未调用 — 计数保留",ap1Title:"① 签名 = 工具 + 规范化 JSON 参数",ap1Cap:"仅键排序——引号变体分开计数。AST 归一化：已验证原型，暂缓（依赖面代价）；逃逸变体由 B 兜底",ap2Title:"② 输出逐字节比对",ap2Cap:"结果相同 = 没有新信息；仓库变了输出就不同，不计数",ap3Title:"③ 每个签名一个独立计数器",ap3Cap:"换命令不清零——轮换无法逃逸",aCounter:(e,t)=>e+"："+t,bVerdictOk:(e,t)=>"有产出——"+e+"/"+t+" 个去重行是新信息 → streak 清零",bVerdictBad:(e,t)=>"零增益——只有 "+e+"/"+t+" 个去重行新（<2 且 <50%）→ streak +1",bVerdictExempt:e=>"豁免——"+e+" 行 < 3：短输出不进 B，streak 不变",bVerdictBlocked:"在执行前被挑战——deny 后不执行、不计数",bStreak:e=>"streak："+e,bWarn:"⚠ 第 3 次警告：「最近几次调用没有产生任何新信息。行动前，先写下你期望获得什么新信息。」",bWarnHigh:"⚠ 第 5 次升级：「这些重复调用一直没有带回新东西。三选一：证伪当前假设、向用户要缺失的输入、或基于已有证据收束。」",bNoCorr:e=>"B ≥ 8，但该签名的 A streak 只有 "+e+"（<3）——B 永不单独拦截，调用放行",bBlock:"⛔ 挑战：全局 streak ≥ 8 且该签名自身 A streak ≥ 3——本次发射被 doom_loop 权限询问拦下。deny 拒绝；allow/always 放行。",stepOf:(e,t)=>"第 "+e+" 次 / 共 "+t+" 次",mechTitle:"完整的执行图景（三个信号之外包裹的机制）",mechNote:"上面的 stepper 展示了三个计数器。当前实现在外层还包着五组机制——全部可在 packages/core/src/plugin/doom-loop/ 对照源码。",mechItems:["<b>同消息守卫</b>：同一条 assistant 消息内相同 (tool, input) 恰好第 3 次发射时被挑战一次（== 3 而非 ≥，之后不再问，避免饿死后续高档位提示）；若其 A streak ≥3 则两条提示合并。这正是拦 #50678「单流 261 次相同发射」的那一层。","<b>不可观测层</b>：后台 shell 与 question 调用弃权 A/B/C——它们的固定回执文本会立刻误触 A。同一不可观测签名 ≥6 次后给一次性提示，引导写进度文件或直接向用户汇报。一个已声明的例外：后台 shell 的<b>启动失败</b>没有回执 metadata，因此会像其它失败调用一样计入信号 C。","<b>一切处置都走 <code>doom_loop</code> 权限询问</b>：保存的答案按签名 × 信号在项目级持久化（<code>:repeat</code> / <code>:unobserved</code> 后缀互不免除）；无交互的宿主自动应答并带反馈，不会挂
